# LIVI OS has no sound server: everything plays through the internal codec, whose HPOUT feeds the
# AB5301B AUX in. carplay's main and alt audio and Siri play at once, dmix mixes them. The microphone
# is on MICIN3, the third of the codec's three capture channels.

ctl.hw {
	@args [ CARD ]
	@args.CARD { type integer default 0 }
	type hw
	card $CARD
}

# dmix and dsnoop wake on the PCM's timer.
timer.hw {
	@args [ CLASS SCLASS CARD DEV SUBDEV ]
	@args.CLASS { type integer default 1 }
	@args.SCLASS { type integer default 0 }
	@args.CARD { type integer default 0 }
	@args.DEV { type integer default 0 }
	@args.SUBDEV { type integer default 0 }
	type hw
	class $CLASS
	sclass $SCLASS
	card $CARD
	device $DEV
	subdevice $SUBDEV
}

ctl.!default {
	type hw
	card 0
}

pcm.!default {
	type asym
	playback.pcm "speaker"
	capture.pcm "mic"
}

pcm.speaker {
	type plug
	slave.pcm "out"
}

# The codec's output driver is off after reset and nothing else switches it on. -18 dB as the Tina
# BSP's headphonegain, the AB5301B sets the volume.
pcm.out {
	type hooks
	slave.pcm "codec_out"
	hooks.0 {
		type ctl_elems
		hook_args [
			{ name "Headphone Playback Switch" value true }
			{ name "Headphone Playback Volume" value 4 }
		]
	}
}

pcm.codec_out {
	type dmix
	ipc_key 5301
	ipc_perm 0600
	slave {
		pcm { type hw card 0 device 0 }
		format S16_LE
		rate 48000
		channels 2
		period_size 1024
		buffer_size 4096
	}
}

pcm.mic {
	type plug
	slave.pcm "mic3"
}

pcm.mic3 {
	type route
	slave {
		pcm "in"
		channels 3
	}
	ttable.0.2 1
}

# The path to MICIN3 is off after reset. Gain at its top, the mic sits differential on MICIN3P/N.
# The ADC adds 21 dB (0xa0 is 0 dB, 0.75 dB a step), 3 dB below its top.
pcm.in {
	type hooks
	slave.pcm "codec_in"
	hooks.0 {
		type ctl_elems
		hook_args [
			{ name "Mic3 Capture Switch" value true }
			{ name "Mic3 Capture Volume" value 31 }
			{ name "ADC3 Capture Volume" value 188 }
		]
	}
}

pcm.codec_in {
	type dsnoop
	ipc_key 5302
	ipc_perm 0600
	slave {
		pcm { type hw card 0 device 0 }
		format S16_LE
		rate 48000
		channels 3
		period_size 1024
		buffer_size 4096
	}
}
