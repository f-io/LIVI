# LIVI-Link AP for iPhone CarPlay handoff (5 GHz to keep the 2.4 GHz band clear for BT).
interface=wlan0
driver=nl80211
bridge=br0
ssid=LIVI-Link
hw_mode=a
channel=36
country_code=DE
ieee80211n=1
ieee80211ac=1
wmm_enabled=1
ht_capab=[HT40+][SHORT-GI-20][SHORT-GI-40]
vht_capab=[SHORT-GI-80]
vht_oper_chwidth=1
vht_oper_centr_freq_seg0_idx=42
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
wpa_pairwise=CCMP
rsn_pairwise=CCMP
wpa_passphrase=livilink
ignore_broadcast_ssid=0
