name: typecheck

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]

jobs:
  checks:
    name: Lint, Typecheck, Tests
    if: ${{ github.actor != 'github-actions' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      HUSKY: 0

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup latest Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Setup pnpm
        run: |
          corepack enable
          corepack install
          echo "pnpm version: $(pnpm -v)"
          node -e "const v=require('child_process').execSync('pnpm -v').toString().trim(); if(!/^12\\./.test(v)){console.error('Expected pnpm 12.x, got', v); process.exit(1);} console.log('pnpm 12 OK');"

      - name: Resolve pnpm store path
        id: pnpm_store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-x64-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-x64-

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Setup Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup target add armv7-unknown-linux-musleabihf
          rustc --version

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: cargo-check-${{ hashFiles('native/Cargo.lock', 'native/**/Cargo.toml') }}
          restore-keys: cargo-check-

      - name: Install native build deps
        shell: bash
        run: |
          set -euo pipefail
          # Not used here, and its index and packages drift apart often enough to break a run.
          sudo rm -f /etc/apt/sources.list.d/*google*
          sudo sed -i '\#dl\.google\.com#d' /etc/apt/sources.list
          grep -rl dl.google.com /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential pkg-config libudev1 ca-certificates libssl-dev \
              libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
              cmake libwayland-dev libxkbcommon-dev
          sudo rm -rf /var/lib/apt/lists/*

      - name: Check Rust formatting
        working-directory: native
        run: cargo fmt --all --check

      - name: Check the Rust workspace (clippy, tests)
        working-directory: native
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Check the dongle daemon for armv7 (clippy)
        working-directory: native
        run: cargo clippy -p livid --target armv7-unknown-linux-musleabihf --locked -- -D warnings

      - name: Run Biome checks
        run: pnpm run lint:check

      - name: Run TypeScript type-check
        run: pnpm run typecheck

      - name: Test + coverage (main)
        run: |
          echo "# Main" >> "$GITHUB_STEP_SUMMARY"
          pnpm run coverage:main

      - name: Test + coverage (renderer)
        run: |
          echo "# Renderer" >> "$GITHUB_STEP_SUMMARY"
          pnpm run coverage:renderer

      - name: Update coverage badges
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          read_pct() {
            node -e 'const fs=require("fs");try{const j=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const p=Number(j?.total?.lines?.pct);process.stdout.write(Number.isFinite(p)?p.toFixed(2)+"%":"0.00%")}catch{process.stdout.write("0.00%")}' "$1"
          }
          MAIN_COVERAGE=$(read_pct coverage/main/coverage-summary.json)
          RENDERER_COVERAGE=$(read_pct coverage/renderer/coverage-summary.json)

          coverage_color() {
            local v="${1%%%}"
            [[ "$v" =~ ^[0-9]+([.][0-9]+)?$ ]] || { echo lightgrey; return; }
            awk -v v="$v" 'BEGIN{ if(v>=80)print"success"; else if(v>=60)print"yellow"; else if(v>=40)print"orange"; else print"red" }'
          }

          rm -rf temp-badges && mkdir temp-badges && cd temp-badges
          git clone --depth=1 --branch version "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}" .
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          mkdir -p .github/badges

          echo "{\"schemaVersion\":1,\"label\":\"coverage main\",\"message\":\"${MAIN_COVERAGE}\",\"color\":\"$(coverage_color "$MAIN_COVERAGE")\"}" > ".github/badges/${BRANCH_NAME}-coverage-main.json"
          echo "{\"schemaVersion\":1,\"label\":\"coverage renderer\",\"message\":\"${RENDERER_COVERAGE}\",\"color\":\"$(coverage_color "$RENDERER_COVERAGE")\"}" > ".github/badges/${BRANCH_NAME}-coverage-renderer.json"

          if [ "${BRANCH_NAME}" = "dev" ]; then
            [ -f .github/badges/main-coverage-main.json ] || cp ".github/badges/${BRANCH_NAME}-coverage-main.json" .github/badges/main-coverage-main.json
            [ -f .github/badges/main-coverage-renderer.json ] || cp ".github/badges/${BRANCH_NAME}-coverage-renderer.json" .github/badges/main-coverage-renderer.json
          fi

          git add .github/badges/*-coverage-*.json
          git commit -m "chore(badges): ${BRANCH_NAME} coverage main ${MAIN_COVERAGE}, renderer ${RENDERER_COVERAGE}" || { echo "No changes"; exit 0; }
          git push

  macos:
    name: macOS (clippy, tests)
    if: ${{ github.actor != 'github-actions' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      PKG_CONFIG_PATH: /Library/Frameworks/GStreamer.framework/Versions/1.0/lib/pkgconfig

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install pkg-config
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew list --versions pkg-config >/dev/null || brew install pkg-config >/dev/null

      - name: Setup Rust
        run: |
          set -euo pipefail
          rustup toolchain install
          rustc --version

      # The same framework version the app bundles, as in the build.
      - name: GStreamer version
        id: gst
        run: echo "version=$(tr -d '[:space:]' < assets/gstreamer/macos-arm64/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Cache GStreamer pkgs
        id: gstcache
        uses: actions/cache@v5
        with:
          path: |
            gst-runtime.pkg
            gst-devel.pkg
          key: gst-pkg-macos-universal-${{ steps.gst.outputs.version }}

      - name: Download GStreamer pkgs
        if: steps.gstcache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          v='${{ steps.gst.outputs.version }}'
          base="https://gstreamer.freedesktop.org/data/pkg/osx/$v"
          curl -fL -o gst-runtime.pkg "$base/gstreamer-1.0-$v-universal.pkg"
          curl -fL -o gst-devel.pkg "$base/gstreamer-1.0-devel-$v-universal.pkg"

      - name: Install GStreamer (runtime + devel)
        run: |
          set -euo pipefail
          sudo installer -pkg gst-runtime.pkg -target /
          sudo installer -pkg gst-devel.pkg -target /

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: cargo-check-macos-${{ hashFiles('native/Cargo.lock', 'native/**/Cargo.toml') }}
          restore-keys: cargo-check-macos-

      - name: Check the Rust workspace without the Linux-only crates (clippy, tests)
        working-directory: native
        env:
          DYLD_LIBRARY_PATH: /Library/Frameworks/GStreamer.framework/Versions/1.0/lib
          LINUX_ONLY: --exclude livi-compositor --exclude livid --exclude livi-accessoryd --exclude livi-mdns --exclude livi-web
        run: |
          cargo clippy --workspace --all-targets --locked $LINUX_ONLY -- -D warnings
          cargo test --workspace --locked $LINUX_ONLY
