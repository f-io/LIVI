name: maintenance

on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: read

jobs:
  cleanup:
    name: Garbage Collection
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETAIN_DAYS: "7"
          RETAIN_SKIPPED_CLA_HOURS: "24"
          KEEP_MINIMUM_RUNS: "1"
        shell: bash
        run: |
          set -euo pipefail

          CUTOFF="$(date -u -d "${RETAIN_DAYS} days ago" +%s)"
          SKIPPED_CLA_CUTOFF="$(date -u -d "${RETAIN_SKIPPED_CLA_HOURS} hours ago" +%s)"

          # Newest first, so the first KEEP_MINIMUM_RUNS of each workflow survive.
          RUNS="$(gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs" \
            --paginate \
            --jq '.workflow_runs[]
              | select(.status == "completed")
              | "\(.id) \(.created_at) \(.workflow_id) \(.conclusion) \(.name)"' \
            | sort -k2 -r || true)"

          if [ -z "${RUNS}" ]; then
            exit 0
          fi

          declare -A SEEN_FOR_WORKFLOW=()

          while read -r ID CREATED WORKFLOW CONCLUSION NAME; do
            [ -n "${ID}" ] || continue

            if [ "${NAME}" = "cla" ] && [ "${CONCLUSION}" = "skipped" ]; then
              if [ "$(date -u -d "${CREATED}" +%s)" -lt "${SKIPPED_CLA_CUTOFF}" ]; then
                gh api -X DELETE -H "Accept: application/vnd.github+json" \
                  "/repos/${GITHUB_REPOSITORY}/actions/runs/${ID}" >/dev/null
              fi
              continue
            fi

            SEEN_FOR_WORKFLOW["${WORKFLOW}"]=$(( ${SEEN_FOR_WORKFLOW[${WORKFLOW}]:-0} + 1 ))
            if [ "${SEEN_FOR_WORKFLOW[${WORKFLOW}]}" -le "${KEEP_MINIMUM_RUNS}" ]; then
              continue
            fi

            if [ "$(date -u -d "${CREATED}" +%s)" -ge "${CUTOFF}" ]; then
              continue
            fi

            gh api -X DELETE -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${ID}" >/dev/null
          done <<< "${RUNS}"

      - name: Cleanup caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          CACHES="$(gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --paginate \
            --jq '.actions_caches[] | "\(.id) \(.last_accessed_at) \(.ref) \(.key)"' \
            | sort -k2 -r || true)"

          if [ -z "${CACHES}" ]; then
            exit 0
          fi

          declare -A KEEP=()

          # Newest first, so the newest cache of each family and branch survives.
          while read -r ID _ REF KEY; do
            [ -n "${ID}" ] || continue

            FAMILY="${KEY%-*}"
            if [[ "${KEY}" == cargo-* ]]; then
              FAMILY="${FAMILY%-*}"
            fi
            if [ -z "${KEEP["${REF} ${FAMILY}"]+x}" ]; then
              KEEP["${REF} ${FAMILY}"]="${ID}"
              continue
            fi
            gh api -X DELETE -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/caches/${ID}" >/dev/null
          done <<< "${CACHES}"

  cla:
    name: Close pull requests without a CLA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/ci

      - name: Close stale pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh scripts/ci/cla.sh stale
