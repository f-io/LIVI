name: gstreamer assets
run-name: "gstreamer-assets → ${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      macos_arm64:
        description: "Build macOS arm64 bundle"
        type: boolean
        default: true
      linux_x64:
        description: "Build Linux x64 bundle"
        type: boolean
        default: true
      linux_arm64:
        description: "Build Linux arm64 bundle"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  plan:
    name: Plan asset matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      is_empty: ${{ steps.plan.outputs.is_empty }}

    steps:
      - id: plan
        shell: bash
        env:
          IN_MACOS_ARM64: ${{ inputs.macos_arm64 }}
          IN_LINUX_X64: ${{ inputs.linux_x64 }}
          IN_LINUX_ARM64: ${{ inputs.linux_arm64 }}
        run: |
          set -euo pipefail

          entries=()
          add() {
            entries+=("{\"os\":\"$1\",\"runner\":\"$2\",\"arch\":\"$3\",\"dir_name\":\"$4\",\"artifact_name\":\"gstreamer-$4\",\"archive_name\":\"gstreamer-$4.tar.gz\"}")
          }
          if [[ "${IN_MACOS_ARM64,,}" == true ]]; then add macos macos-latest arm64 macos-arm64; fi
          if [[ "${IN_LINUX_X64,,}" == true ]]; then add linux ubuntu-24.04 x64 linux-x64; fi
          if [[ "${IN_LINUX_ARM64,,}" == true ]]; then add linux ubuntu-24.04-arm arm64 linux-arm64; fi

          matrix="{\"include\":[$(IFS=,; echo "${entries[*]-}")]}"
          is_empty=$([[ ${#entries[@]} -eq 0 ]] && echo true || echo false)

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "is_empty=$is_empty" >> "$GITHUB_OUTPUT"
          echo "Planned matrix: $matrix"
          echo "Empty: $is_empty"

  build:
    name: Build assets (${{ matrix.os }}-${{ matrix.arch }})
    needs: plan
    if: ${{ needs.plan.outputs.is_empty != 'true' }}
    runs-on: ${{ matrix.runner }}
    # A platform that cannot be built right now is an expected picture here, not a broken run. It
    # stays red in the job list, and publish fails the run if nothing at all came through.
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      # ----------------------------
      # macOS arm64
      # ----------------------------
      - name: Download GStreamer runtime pkg [macos-arm64]
        if: matrix.os == 'macos' && matrix.arch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          # GStreamer uses GNOME-style versioning: even minor = stable, odd = dev.
          GST_VERSION=$(curl -fsSL https://gstreamer.freedesktop.org/data/pkg/osx/ \
            | grep -oE 'href="[0-9]+\.[0-9]+\.[0-9]+/"' \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' \
            | awk -F. '$2 % 2 == 0' \
            | sort -V \
            | tail -1)
          if [[ -z "$GST_VERSION" ]]; then
            echo "Failed to resolve latest stable GStreamer version from osx listing"
            exit 1
          fi
          echo "Resolved macOS GStreamer: $GST_VERSION"
          echo "GST_VERSION=$GST_VERSION" >> "$GITHUB_ENV"
          base="https://gstreamer.freedesktop.org/data/pkg/osx/${GST_VERSION}"
          curl -fL -o gstreamer-runtime.pkg "${base}/gstreamer-1.0-${GST_VERSION}-universal.pkg"
          # devel pkg carries the headers and .pc files build-patched-macos.sh needs
          curl -fL -o gstreamer-devel.pkg "${base}/gstreamer-1.0-devel-${GST_VERSION}-universal.pkg"

      - name: Install GStreamer runtime + devel pkg [macos-arm64]
        if: matrix.os == 'macos' && matrix.arch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          sudo installer -pkg gstreamer-runtime.pkg -target /
          sudo installer -pkg gstreamer-devel.pkg -target /

      - name: Build patched applemedia (vtdec) [macos-arm64]
        if: matrix.os == 'macos' && matrix.arch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          # glib generator tools (the framework's carry a dead cerbero shebang) + build system
          brew install glib meson ninja
          chmod +x scripts/gstreamer/build-patched-macos.sh
          scripts/gstreamer/build-patched-macos.sh "$RUNNER_TEMP/applemedia"
          echo "PATCHED_APPLEMEDIA=$RUNNER_TEMP/applemedia/libgstapplemedia.dylib" >> "$GITHUB_ENV"

      - name: Build faad plugin (DAB+ audio) [macos-arm64]
        if: matrix.os == 'macos' && matrix.arch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake
          chmod +x scripts/gstreamer/build-faad-macos.sh
          scripts/gstreamer/build-faad-macos.sh "$RUNNER_TEMP/faad"
          echo "FAAD_PLUGIN=$RUNNER_TEMP/faad/libgstfaad.dylib" >> "$GITHUB_ENV"

      - name: Build bundle [macos-arm64]
        if: matrix.os == 'macos' && matrix.arch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/gstreamer/package-macos.sh
          scripts/gstreamer/package-macos.sh "assets/gstreamer/${{ matrix.dir_name }}"

      - name: Smoke test bundle [macos-arm64]
        if: matrix.os == 'macos' && matrix.arch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/gstreamer/smoke-test-macos.sh
          scripts/gstreamer/smoke-test-macos.sh "assets/gstreamer/${{ matrix.dir_name }}"

      - name: Write version file [macos-arm64]
        if: matrix.os == 'macos' && matrix.arch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$("assets/gstreamer/${{ matrix.dir_name }}/bin/gst-launch-1.0" --version | awk '/^gst-launch-1.0 version / { print $3; exit }')"
          printf '%s\n' "$VERSION" > "assets/gstreamer/${{ matrix.dir_name }}/version.txt"
          echo "Version: $VERSION"

      - name: Pack artifact [macos-arm64]
        if: matrix.os == 'macos' && matrix.arch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          tar -C assets/gstreamer -czf "${{ matrix.archive_name }}" "${{ matrix.dir_name }}"

      - name: Upload artifact [macos-arm64]
        if: matrix.os == 'macos' && matrix.arch == 'arm64'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_name }}
          retention-days: 7

      # ----------------------------
      # Linux x64
      # ----------------------------
      - name: Build bundle [linux-x64 via Debian stable]
        if: matrix.os == 'linux' && matrix.arch == 'x64'
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/gstreamer/package-linux.sh
          chmod +x scripts/gstreamer/smoke-test-linux.sh
          chmod +x scripts/gstreamer/build-backport-linux.sh

          # ceiling = glibc of the current Debian stable (the deploy target)
          GLIBC_CEILING="$(docker run --rm debian:stable-slim getconf GNU_LIBC_VERSION | awk '{print $2}')"
          echo "glibc ceiling from current Debian stable: GLIBC_$GLIBC_CEILING"

          docker run --rm --platform=linux/amd64 \
            -e GLIBC_CEILING="$GLIBC_CEILING" \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            debian:stable-slim sh -lc '
              set -euo pipefail

              export DEBIAN_FRONTEND=noninteractive

              apt-get update
              apt-get install -y --no-install-recommends \
                bash coreutils findutils file dpkg-dev patchelf ca-certificates

              scripts/gstreamer/build-backport-linux.sh

              scripts/gstreamer/package-linux.sh "assets/gstreamer/linux-x64"
              scripts/gstreamer/smoke-test-linux.sh "assets/gstreamer/linux-x64"

              VERSION="$(assets/gstreamer/linux-x64/bin/gst-launch-1.0 --version | awk '"'"'/^gst-launch-1.0 version / { print $3; exit }'"'"')"
              printf "%s\n" "$VERSION" > assets/gstreamer/linux-x64/version.txt
              echo "Version: $VERSION"
            '

      - name: Fix file permissions [linux-x64]
        if: matrix.os == 'linux' && matrix.arch == 'x64'
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R "$USER:$USER" "assets/gstreamer/${{ matrix.dir_name }}" 2>/dev/null || true
          sudo chmod -R a+rX "assets/gstreamer/${{ matrix.dir_name }}" 2>/dev/null || true

      - name: Pack artifact [linux-x64]
        if: matrix.os == 'linux' && matrix.arch == 'x64'
        shell: bash
        run: |
          set -euo pipefail
          tar -C assets/gstreamer -czf "${{ matrix.archive_name }}" "${{ matrix.dir_name }}"

      - name: Upload artifact [linux-x64]
        if: matrix.os == 'linux' && matrix.arch == 'x64'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_name }}
          retention-days: 7

      # ----------------------------
      # Linux arm64
      # ----------------------------
      - name: Build bundle [linux-arm64 via Debian stable]
        if: matrix.os == 'linux' && matrix.arch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/gstreamer/package-linux.sh
          chmod +x scripts/gstreamer/smoke-test-linux.sh
          chmod +x scripts/gstreamer/build-backport-linux.sh

          # ceiling = glibc of the current Debian stable (the deploy target)
          GLIBC_CEILING="$(docker run --rm debian:stable-slim getconf GNU_LIBC_VERSION | awk '{print $2}')"
          echo "glibc ceiling from current Debian stable: GLIBC_$GLIBC_CEILING"

          docker run --rm --platform=linux/arm64/v8 \
            -e GLIBC_CEILING="$GLIBC_CEILING" \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            debian:stable-slim sh -lc '
              set -euo pipefail

              export DEBIAN_FRONTEND=noninteractive

              apt-get update
              apt-get install -y --no-install-recommends \
                bash coreutils findutils file dpkg-dev patchelf ca-certificates

              APPLY_PATCHES=1 scripts/gstreamer/build-backport-linux.sh

              scripts/gstreamer/package-linux.sh "assets/gstreamer/linux-arm64"
              scripts/gstreamer/smoke-test-linux.sh "assets/gstreamer/linux-arm64"

              VERSION="$(assets/gstreamer/linux-arm64/bin/gst-launch-1.0 --version | awk '"'"'/^gst-launch-1.0 version / { print $3; exit }'"'"')"
              printf "%s\n" "$VERSION" > assets/gstreamer/linux-arm64/version.txt
              echo "Version: $VERSION"
            '

      - name: Fix file permissions [linux-arm64]
        if: matrix.os == 'linux' && matrix.arch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R "$USER:$USER" "assets/gstreamer/${{ matrix.dir_name }}" 2>/dev/null || true
          sudo chmod -R a+rX "assets/gstreamer/${{ matrix.dir_name }}" 2>/dev/null || true

      - name: Pack artifact [linux-arm64]
        if: matrix.os == 'linux' && matrix.arch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          tar -C assets/gstreamer -czf "${{ matrix.archive_name }}" "${{ matrix.dir_name }}"

      - name: Upload artifact [linux-arm64]
        if: matrix.os == 'linux' && matrix.arch == 'arm64'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_name }}
          retention-days: 7

  publish:
    name: Publish gstreamer assets
    needs:
      - plan
      - build
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.is_empty != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: gstreamer-*
          merge-multiple: true
          path: .artifacts

      - name: Check that something was built
        shell: bash
        run: |
          set -euo pipefail
          if ! ls .artifacts/gstreamer-*.tar.gz >/dev/null 2>&1; then
            echo "no platform produced an asset"
            exit 1
          fi

      - name: Publish bundles
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for plat in macos-arm64 linux-x64 linux-arm64; do
            archive=".artifacts/gstreamer-${plat}.tar.gz"
            [[ -f "$archive" ]] || continue
            sh scripts/assets.sh publish gstreamer "$plat" "$archive"
          done

      - name: Read Linux version for badge
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          # The badge tracks the Linux version
          VERSION=""
          if [[ -f assets/gstreamer/linux-x64/version.txt ]]; then
            VERSION="$(cat assets/gstreamer/linux-x64/version.txt)"
          elif [[ -f assets/gstreamer/linux-arm64/version.txt ]]; then
            VERSION="$(cat assets/gstreamer/linux-arm64/version.txt)"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and push assets
        id: commit_assets
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # One commit per platform
          changed=false
          for plat in linux-x64 linux-arm64 macos-arm64; do
            dir="assets/gstreamer/${plat}"
            [[ -d "$dir" ]] || continue
            git add -A "$dir"
            if git diff --cached --quiet -- "$dir"; then
              continue
            fi
            ver=""
            [[ -f "$dir/version.txt" ]] && ver="$(cat "$dir/version.txt")"

            # For Linux, show which Debian package(s) actually changed.
            detail=""
            if [[ "$plat" == linux-* && -f "$dir/packages.txt" ]]; then
              old="$(git show "HEAD:$dir/packages.txt" 2>/dev/null || true)"
              if [[ -n "$old" ]]; then
                detail="$(comm -13 <(printf '%s\n' "$old" | sort -u) <(sort -u "$dir/packages.txt") | paste -sd', ' -)"
              fi
            fi

            if [[ -n "$detail" ]]; then
              git commit -m "chore(gstreamer): update ${plat} bundle (${detail})"
            elif [[ -n "$ver" ]]; then
              git commit -m "chore(gstreamer): update ${plat} bundle to ${ver}"
            else
              git commit -m "chore(gstreamer): update ${plat} bundle"
            fi
            changed=true
          done

          if [[ "$changed" == "true" ]]; then
            git push
          else
            echo "No asset changes to commit"
          fi
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"

      - name: Push gstreamer badge
        if: steps.commit_assets.outputs.changed == 'true' && steps.meta.outputs.version != '' && (github.ref_name == 'main' || github.ref_name == 'dev')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          GSTREAMER_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          BADGE_DIR="$(mktemp -d)"
          cd "$BADGE_DIR"

          git clone --depth=1 --branch version "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}" .

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          mkdir -p .github/badges
          echo "{\"schemaVersion\":1,\"label\":\"gstreamer\",\"message\":\"${GSTREAMER_VERSION}\",\"color\":\"blue\"}" > ".github/badges/${BRANCH_NAME}-gstreamer.json"

          git add ".github/badges/${BRANCH_NAME}-gstreamer.json"

          if [[ -z "$(git status --porcelain -- ".github/badges/${BRANCH_NAME}-gstreamer.json")" ]]; then
            echo "No badge changes"
            exit 0
          fi

          git commit -m "chore(badges): ${BRANCH_NAME} -> gstreamer ${GSTREAMER_VERSION}"
          git push
