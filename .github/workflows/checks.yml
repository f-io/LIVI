name: checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  linux:
    name: Linux (fmt, clippy, tests)
    if: ${{ github.actor != 'github-actions' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup update stable --no-self-update
          rustup toolchain install
          rustup target add armv7-unknown-linux-musleabihf
          rustc --version

      - name: Restore cargo cache
        id: cargo
        uses: ./.github/actions/cargo-cache/restore
        with:
          name: check-linux

      - name: Install native build deps
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/*google*
          sudo sed -i '\#dl\.google\.com#d' /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential pkg-config libudev1 ca-certificates libssl-dev \
              libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
              cmake libwayland-dev libxkbcommon-dev libfontconfig1-dev \
              libudev-dev libinput-dev libseat-dev libgbm-dev
          sudo rm -rf /var/lib/apt/lists/*

      - name: Check Rust formatting
        working-directory: native
        run: cargo fmt --all --check

      - name: Check the Rust workspace (clippy, tests)
        working-directory: native
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Check the dongle daemon for armv7 (clippy)
        working-directory: native
        run: cargo clippy -p livid --target armv7-unknown-linux-musleabihf --locked -- -D warnings

      - name: Save cargo cache
        if: ${{ steps.cargo.outputs.hit != 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}
        uses: ./.github/actions/cargo-cache/save
        with:
          key: ${{ steps.cargo.outputs.key }}

  macos:
    name: macOS (clippy, tests)
    if: ${{ github.actor != 'github-actions' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install pkg-config
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew list --versions pkg-config >/dev/null || brew install pkg-config >/dev/null

      - name: Setup Rust
        run: |
          set -euo pipefail
          rustup update stable --no-self-update
          rustup toolchain install
          rustc --version

      - name: GStreamer version
        id: gst
        run: echo "version=$(tr -d '[:space:]' < assets/gstreamer/macos-arm64/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Cache GStreamer pkgs
        id: gstcache
        uses: actions/cache@v6
        with:
          path: |
            gst-runtime.pkg
            gst-devel.pkg
          key: gst-pkg-macos-universal-${{ steps.gst.outputs.version }}

      - name: Download GStreamer pkgs
        if: steps.gstcache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          v='${{ steps.gst.outputs.version }}'
          base="https://gstreamer.freedesktop.org/data/pkg/osx/$v"
          curl -fL -C - --retry 10 --retry-all-errors --retry-delay 5 -o gst-runtime.pkg "$base/gstreamer-1.0-$v-universal.pkg"
          curl -fL -C - --retry 10 --retry-all-errors --retry-delay 5 -o gst-devel.pkg "$base/gstreamer-1.0-devel-$v-universal.pkg"
          runtime_sha=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 "$base/gstreamer-1.0-$v-universal.pkg.sha256sum" | cut -d' ' -f1)
          devel_sha=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 "$base/gstreamer-1.0-devel-$v-universal.pkg.sha256sum" | cut -d' ' -f1)
          printf '%s  gst-runtime.pkg\n%s  gst-devel.pkg\n' "$runtime_sha" "$devel_sha" | shasum -a 256 -c

      - name: Install GStreamer (runtime + devel)
        run: |
          set -euo pipefail
          sudo installer -pkg gst-runtime.pkg -target /
          sudo installer -pkg gst-devel.pkg -target /

      - name: Restore cargo cache
        id: cargo
        uses: ./.github/actions/cargo-cache/restore
        with:
          name: check-macos

      - name: Check the Rust workspace without the Linux-only crates (clippy, tests)
        working-directory: native
        env:
          DYLD_LIBRARY_PATH: /Library/Frameworks/GStreamer.framework/Versions/1.0/lib
        run: |
          linux_only=(--exclude livi-compositor)
          cargo clippy --workspace --all-targets --locked "${linux_only[@]}" -- -D warnings
          cargo test --workspace --locked "${linux_only[@]}"

      - name: Save cargo cache
        if: ${{ steps.cargo.outputs.hit != 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}
        uses: ./.github/actions/cargo-cache/save
        with:
          key: ${{ steps.cargo.outputs.key }}

  android:
    name: Android (clippy)
    if: ${{ github.actor != 'github-actions' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup update stable --no-self-update
          rustup toolchain install
          rustc --version

      - name: Restore cargo cache
        id: cargo
        uses: ./.github/actions/cargo-cache/restore
        with:
          name: check-android

      - name: Set up the Android build
        uses: ./.github/actions/android-setup

      - name: Check the Android build (clippy)
        working-directory: native
        run: cargo xtask check-android

      - name: Save cargo cache
        if: ${{ steps.cargo.outputs.hit != 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}
        uses: ./.github/actions/cargo-cache/save
        with:
          key: ${{ steps.cargo.outputs.key }}

  lint:
    name: Lint (dprint, actionlint, license headers)
    if: ${{ github.actor != 'github-actions' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Check formatting (YAML, Markdown, JSON, TOML)
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/dprint.zip" \
            https://github.com/dprint/dprint/releases/download/0.64.3/dprint-x86_64-unknown-linux-gnu.zip
          echo "f71cb7e22d6776439eba168d5cb296092d6413fea7148fe4d70684a2702a4fee  $RUNNER_TEMP/dprint.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/dprint.zip" -d "$RUNNER_TEMP/dprint"
          "$RUNNER_TEMP/dprint/dprint" check

      - name: Lint the workflows
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: Check the license headers
        run: sh scripts/spdx-header.sh --check
