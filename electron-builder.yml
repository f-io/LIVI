appId: dev.f-io.livi
productName: LIVI

directories:
  buildResources: assets

files:
  - out/**
  - package.json
  - node_modules/**
  - '!**/.cache/**'
  - '!**/.pnpm-store/**'
  - '!**/node_modules/.vite/**'
  - '!**/node_modules/.cache/**'
  - '!**/.vscode/**'
  - '!**/*.map'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,CHANGELOG.md,README.md}'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!src/**'
  - '!out/main/driver/**'
  - '!out/compositor/**'
  - '!**/node_modules/livi-gst-video/{rust,src}/**'
  - '!**/node_modules/livi-crypto/{rust,src}/**'

asarUnpack:
  - resources/**
  - node_modules/livi-gst-video/**
  - node_modules/livi-crypto/**

linux:
  target:
    - AppImage
  icon: icons/linux/livi.png
  maintainer: 'Lasse Heitgres <hello@f-io.dev>'
  category: Utility
  syncDesktopName: true
  extraResources:
    - from: out/compositor
      to: compositor
    - from: assets/linux/dev.f-io.livi.metainfo.xml
      to: ../share/metainfo/dev.f-io.livi.metainfo.xml
    - from: assets/linux/99-LIVI.rules.template
      to: 99-LIVI.rules.template
    - from: assets/linux/99-LIVI-bt.sudoers.template
      to: 99-LIVI-bt.sudoers.template
    - from: assets/linux/livi-touch-filter
      to: livi-touch-filter
    - from: assets/displays
      to: displays
    - from: scripts/install/pi/setup-hdmi-pr-display.sh
      to: setup-hdmi-pr-display.sh
    - from: scripts/install/packages.txt
      to: packages.txt
    - from: assets/gstreamer/linux-x64
      to: gstreamer/linux-x64
      filter:
        - '**/*'
        - '!**/*.a'
        - '!share/**'
    - from: assets/gstreamer/linux-arm64
      to: gstreamer/linux-arm64
      filter:
        - '**/*'
        - '!**/*.a'
        - '!share/**'
    - from: native/livi-helperd/target/release/livi-helperd
      to: driver/livi-helperd

mac:
  identity: '-'
  notarize: false
  hardenedRuntime: true
  entitlements: assets/mac/entitlements.mac.plist
  entitlementsInherit: assets/mac/entitlements.mac.inherit.plist
  icon: icons/mac/livi.icns
  category: public.app-category.utilities
  extendInfo:
    NSCameraUsageDescription: LIVI requires camera access for CarPlay.
    NSMicrophoneUsageDescription: LIVI requires microphone access for voice control.
    NSDocumentsFolderUsageDescription: LIVI requires access to documents.
    NSDownloadsFolderUsageDescription: LIVI requires access to downloads.
  extraResources:
    - from: assets/gstreamer/macos-arm64
      to: gstreamer/macos-arm64
      filter:
        - '**/*'
        - '!**/*.a'
        - '!share/**'
    - from: native/livi-helperd/target/release/livi-helperd
      to: driver/livi-helperd

dmg:
  artifactName: ${name}-${version}-macos-${arch}.${ext}

appImage:
  artifactName: ${name}-${version}-linux-${arch}.${ext}

npmRebuild: false

copyright: 'Copyright © 2026 Lasse Heitgres'
publish: null

toolsets:
  appimage: '1.0.2'
