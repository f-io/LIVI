[package]
name = "livi-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "livi-core"
path = "src/main.rs"

[dependencies]
livi-base.workspace = true
livi-crypto.workspace = true
livi-core-proto.workspace = true
livi-i18n.workspace = true
iap2-mfi = { workspace = true, features = ["files"] }
livi-aa-stack.workspace = true
livi-cp.workspace = true
livi-link-host.workspace = true
livi-output-proto.workspace = true
livi-media.workspace = true
livi-dab.workspace = true
livi-fm.workspace = true
livi-rtlsdr.workspace = true
livi-session-io.workspace = true
livi-wifi.workspace = true
axum = "0.8.9"
base64.workspace = true
flate2.workspace = true
jiff = { version = "0.2.43", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
libc.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
skrifa = { version = "0.50.0", default-features = false, features = ["std"] }
socketioxide = "0.18.9"
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "sync",
  "signal",
  "time",
  "process",
  "fs",
] }
tower-http = { version = "0.7.1", features = ["cors"] }
zbus = { workspace = true, features = ["tokio"] }

[target.'cfg(target_os = "android")'.dependencies]
livi-aaudio.workspace = true
livi-net.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
