[package]
name = "livi-cp"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["url-video"]
url-video = ["dep:foreign-types", "dep:openssl", "dep:openssl-sys", "dep:tokio-openssl"]

[dependencies]
livi-base.workspace = true
livi-crypto.workspace = true
base64.workspace = true
# The version the openssl crate implements, its trait is where Ssl::as_ptr comes from.
foreign-types = { version = "0.3.2", optional = true }
livi-core-proto.workspace = true
livi-session-io.workspace = true
num-bigint = "0.5.1"
openssl = { version = "0.10.82", optional = true }
openssl-sys = { version = "0.9.118", optional = true }
p256 = "0.14.0"
rustls.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
socket2 = { workspace = true, features = ["all"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util", "sync", "time"] }
tokio-openssl = { version = "0.6.5", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
uuid = { workspace = true, features = ["v4"] }
x509-cert = { version = "0.3.1", default-features = false, features = ["pem"] }

[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "android"))'.dependencies]
openssl = { version = "0.10.82", features = ["vendored"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
livi-net.workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies]
rustls-native-certs = "0.8"

[dev-dependencies]
openssl = "0.10.82"
tokio-openssl = "0.6.5"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "test-util"] }

[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "android"))'.dev-dependencies]
openssl = { version = "0.10.82", features = ["vendored"] }

[lints]
workspace = true
