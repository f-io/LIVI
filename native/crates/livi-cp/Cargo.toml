[package]
name = "livi-cp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
livi-base.workspace = true
livi-crypto.workspace = true
base64.workspace = true
# The version the openssl crate implements, its trait is where Ssl::as_ptr comes from.
foreign-types = "0.3.2"
livi-core-proto.workspace = true
livi-net.workspace = true
livi-session-io.workspace = true
num-bigint = "0.5.1"
openssl = "0.10.82"
openssl-sys = "0.9.118"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
socket2 = { workspace = true, features = ["all"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util", "sync", "time"] }
tokio-openssl = "0.6.5"
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "android"))'.dependencies]
openssl = { version = "0.10.82", features = ["vendored"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "test-util"] }

[lints]
workspace = true
