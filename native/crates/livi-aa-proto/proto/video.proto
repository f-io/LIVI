syntax = "proto2";

package livi.aa;

enum CriticalUiFocus {
  CRITICAL_UI_FOCUS_UNKNOWN = 0;
  CRITICAL_UI_FOCUS_PROJECTED = 1;
  CRITICAL_UI_FOCUS_NATIVE = 2;
}

enum DisplayType {
  DISPLAY_TYPE_MAIN = 0;
  DISPLAY_TYPE_CLUSTER = 1;
  DISPLAY_TYPE_AUXILIARY = 2;
}

enum MediaCodecType {
  MEDIA_CODEC_TYPE_AUDIO_PCM = 1;
  MEDIA_CODEC_TYPE_AUDIO_AAC_LC = 2;
  MEDIA_CODEC_TYPE_VIDEO_H264_BP = 3;
  MEDIA_CODEC_TYPE_AUDIO_AAC_LC_ADTS = 4;
  MEDIA_CODEC_TYPE_VIDEO_VP9 = 5;
  MEDIA_CODEC_TYPE_VIDEO_AV1 = 6;
  MEDIA_CODEC_TYPE_VIDEO_H265 = 7;
}

enum NativeUiElementType {
  NATIVE_UI_ELEMENT_TYPE_UNKNOWN = 0;
  NATIVE_UI_ELEMENT_TYPE_RAIL = 1;
  NATIVE_UI_ELEMENT_TYPE_STATUS_BAR = 2;
  NATIVE_UI_ELEMENT_TYPE_VALUE_3 = 3;
}

enum ThemingTokensStatus {
  THEMING_TOKENS_STATUS_ERROR = 0;
  THEMING_TOKENS_STATUS_ACCEPTED = 1;
  THEMING_TOKENS_STATUS_REJECTED = 2;
}

enum UiActionType {
  UI_ACTION_TYPE_UNKNOWN = 0;
  UI_ACTION_TYPE_RESIZE_TO_SMALLER = 1;
  UI_ACTION_TYPE_RESIZE_TO_LARGER = 2;
}

enum UiElement {
  UI_ELEMENT_UNKNOWN = 0;
  UI_ELEMENT_CLOCK = 1;
  UI_ELEMENT_BATTERY_LEVEL = 2;
  UI_ELEMENT_PHONE_SIGNAL = 3;
  UI_ELEMENT_NATIVE_UI_AFFORDANCE = 4;
  UI_ELEMENT_NAVIGATION_TURN_DATA_AVAILABLE = 5;
}

enum UiTheme {
  UI_THEME_AUTOMATIC = 0;
  UI_THEME_LIGHT = 1;
  UI_THEME_DARK = 2;
}

enum VideoCodecResolution {
  VIDEO_CODEC_RESOLUTION_800x480 = 1;
  VIDEO_CODEC_RESOLUTION_1280x720 = 2;
  VIDEO_CODEC_RESOLUTION_1920x1080 = 3;
  VIDEO_CODEC_RESOLUTION_2560x1440 = 4;
  VIDEO_CODEC_RESOLUTION_3840x2160 = 5;
  VIDEO_CODEC_RESOLUTION_720x1280 = 6;
  VIDEO_CODEC_RESOLUTION_1080x1920 = 7;
  VIDEO_CODEC_RESOLUTION_1440x2560 = 8;
  VIDEO_CODEC_RESOLUTION_2160x3840 = 9;
}

enum VideoFocusMode {
  VIDEO_FOCUS_MODE_PROJECTED = 1;
  VIDEO_FOCUS_MODE_NATIVE = 2;
  VIDEO_FOCUS_MODE_NATIVE_TRANSIENT = 3;
  VIDEO_FOCUS_MODE_PROJECTED_NO_INPUT_FOCUS = 4;
}

enum VideoFocusReason {
  VIDEO_FOCUS_REASON_UNKNOWN = 0;
  VIDEO_FOCUS_REASON_PHONE_SCREEN_OFF = 1;
  VIDEO_FOCUS_REASON_LAUNCH_NATIVE = 2;
  VIDEO_FOCUS_REASON_LAST_MODE = 3;
  VIDEO_FOCUS_REASON_USER_SELECTION = 4;
}

enum VideoFrameRate {
  VIDEO_FRAME_RATE_60 = 1;
  VIDEO_FRAME_RATE_30 = 2;
}

message ActionTakenNotification {
  optional UiActionType action_type = 1;
}

message BlendedUiConfig {
  optional DisplayCornerRadii window_corner_radii = 1;
  repeated NativeUiElement native_ui_elements = 2;
}

message CriticalUiNotification {
  optional CriticalUiFocus focus = 1;
}

message DisplayCornerRadii {
  optional uint32 top_left = 1;
  optional uint32 top_right = 2;
  optional uint32 bottom_left = 3;
  optional uint32 bottom_right = 4;
}

message DisplayCutout {
  optional DisplayRect bounds = 1;
}

message DisplayInsets {
  optional uint32 top = 1;
  optional uint32 bottom = 2;
  optional uint32 left = 3;
  optional uint32 right = 4;
}

message DisplayRect {
  optional uint32 top = 1;
  optional uint32 bottom = 2;
  optional uint32 left = 3;
  optional uint32 right = 4;
}

message IntegratedOverlayBounds {
  optional int32 left = 1;
  optional int32 top = 2;
  optional int32 right = 3;
  optional int32 bottom = 4;
}

message IntegratedOverlayCornerRadius {
  optional float radius = 1;
}

message IntegratedOverlayParameters {
  optional int32 content_type = 1;
  optional IntegratedOverlayBounds bounds = 2;
  optional IntegratedOverlayCornerRadius corner_radius = 3;
}

message IntegratedOverlayParametersNotification {
  repeated IntegratedOverlayParameters overlay_parameters = 1;
}

message IntegratedOverlayStartNotification {
  optional int32 content_type = 1;
}

message NativeUiElement {
  optional DisplayRect position = 1;
  optional NativeUiElementType element_type = 2;
}

message UiAction {
  optional UiActionType action_type = 1;
}

message UiConfig {
  optional DisplayInsets margins = 1;
  optional DisplayInsets content_insets = 2;
  optional DisplayInsets stable_content_insets = 3;
  optional UiTheme ui_theme = 4;
  repeated UiElement head_unit_ui_elements = 5;
  repeated UiAction supported_actions = 6;
  repeated DisplayCutout cutouts = 7;
  optional BlendedUiConfig blended_ui_config = 8;
}

message UiStyle {
  repeated UiStyleToken light_tokens = 1;
  repeated UiStyleToken dark_tokens = 2;
}

message UiStyleColorToken {
  optional uint32 color = 1;
}

message UiStyleToken {
  optional string name = 1;
  oneof value {
    UiStyleColorToken color_token = 2;
  }
}

message UpdateHeadUnitUiConfigRequest {
  optional UiStyle ui_style = 1;
}

message UpdateHeadUnitUiConfigResponse {
  optional ThemingTokensStatus status = 1;
}

message UpdateUiConfigRequest {
  optional UiConfig ui_config = 1;
}

message VideoConfiguration {
  optional VideoCodecResolution codec_resolution = 1;
  optional VideoFrameRate frame_rate = 2;
  optional uint32 margin_width = 3;
  optional uint32 margin_height = 4;
  optional uint32 density_dpi = 5;
  optional uint32 decoder_additional_depth = 6;
  optional uint32 pixel_aspect_ratio_e4 = 8;
  optional uint32 real_density_dpi = 9;
  optional MediaCodecType codec_type = 10;
  optional UiConfig ui_config = 11;
}

message VideoFocusNotification {
  optional VideoFocusMode mode = 1;
  optional bool unsolicited = 2;
}

message VideoFocusRequest {
  optional VideoFocusMode mode = 2;
  optional VideoFocusReason reason = 3;
}
