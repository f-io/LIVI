enum NavigationNextTurnType {
  NAVIGATION_NEXT_TURN_TYPE_UNKNOWN = 0;
  NAVIGATION_NEXT_TURN_TYPE_DEPART = 1;
  NAVIGATION_NEXT_TURN_TYPE_NAME_CHANGE = 2;
  NAVIGATION_NEXT_TURN_TYPE_SLIGHT_TURN = 3;
