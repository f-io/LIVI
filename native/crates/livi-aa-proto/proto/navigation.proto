enum NavigationStatus {
  NAVIGATION_STATUS_UNAVAILABLE = 0;
  NAVIGATION_STATUS_ACTIVE = 1;
  NAVIGATION_STATUS_INACTIVE = 2;
  NAVIGATION_STATUS_REROUTING = 3;
}

enum NavigationTurnSide {
  NAVIGATION_TURN_SIDE_LEFT = 1;
  NAVIGATION_TURN_SIDE_RIGHT = 2;
  NAVIGATION_TURN_SIDE_UNSPECIFIED = 3;
}

message DriverAssistancePath {
  repeated sint32 latitude_e7_diffs = 1;
  repeated sint32 longitude_e7_diffs = 2;
  repeated sint32 altitude_dm_diffs = 3;
}

message DriverAssistanceRoute {
  optional DriverAssistancePath path = 1;
  optional DriverAssistanceTrip trip = 2;
}

message DriverAssistanceRouteNotification {
  optional bytes serialized_route = 1;
}

message DriverAssistanceTrip {
  optional string identifier = 1;
  optional int32 sequence_number = 2;
  optional DriverAssistancePath most_probable_path = 3;
}

message NavigationChargingStation {
  optional int32 min_departure_energy_wh = 1;
  optional int32 max_rated_power_watts = 2;
  optional int32 estimated_charging_time_seconds = 3;
}

message NavigationCue {
  repeated string alternate_texts = 1;
}

message NavigationCurrentPositionNotification {
  optional NavigationStepDistance step_distance = 1;
  repeated NavigationDestinationDistance destination_distances = 2;
  optional NavigationRoad current_road = 3;
}

message NavigationDestination {
  optional string address = 1;
  optional NavigationChargingStation charging_station = 2;
}

message NavigationDestinationDistance {
  optional NavigationDistance distance = 1;
  optional string estimated_time_of_arrival = 2;
  optional int64 time_to_arrival_seconds = 3;
}

message NavigationDistance {
  optional int32 distance_m = 1;
  optional string display_value = 2;
  optional NavigationDistanceUnit display_unit = 3;
}

message NavigationImageOptions {
  required int32 height = 1;
  required int32 width = 2;
  required int32 color_depth_bits = 3;
}

message NavigationLane {
  repeated NavigationLaneDirection lane_directions = 1;
}

message NavigationLaneDirection {
  optional NavigationLaneShape lane_shape = 1;
  optional bool highlighted = 2;
}

message NavigationManeuver {
  optional NavigationManeuverType type = 1;
  optional int32 roundabout_exit_number = 2;
  optional int32 roundabout_exit_angle_degrees = 3;
}

message NavigationNextTurnNotification {
  required string road_name = 1;
  optional NavigationTurnSide turn_side = 2;
  optional NavigationNextTurnType turn_type = 3;
  optional bytes turn_image = 4;
  optional int32 roundabout_exit_number = 5;
  optional int32 roundabout_exit_angle_degrees = 6;
}

message NavigationRoad {
  optional string name = 1;
}

message NavigationStateNotification {
  repeated NavigationStep steps = 1;
  repeated NavigationDestination destinations = 2;
}

message NavigationStatusNotification {
  required NavigationStatus status = 1;
}

message NavigationStatusService {
  required int32 minimum_interval_ms = 1;
  required NavigationClusterType cluster_type = 2;
  optional NavigationImageOptions image_options = 3;
}

message NavigationStep {
  optional NavigationManeuver maneuver = 1;
  optional NavigationRoad road = 2;
  repeated NavigationLane lanes = 3;
  optional NavigationCue cue = 4;
}

message NavigationStepDistance {
  optional NavigationDistance distance = 1;
  optional int64 time_to_step_seconds = 2;
}

message NavigationTurnDistanceNotification {
  required int32 distance_m = 1;
  required int32 time_to_turn_seconds = 2;
  optional int32 display_distance_e3 = 3;
  optional NavigationDistanceUnit display_distance_unit = 4;
}

message VehicleEnergyForecastNotification {
  optional bytes serialized_forecast = 1;
}
