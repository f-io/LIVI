[package]
name = "livi-session-io"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
livi-base.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time", "sync", "io-util", "net"] }
thiserror.workspace = true

[target.'cfg(not(target_os = "ios"))'.dependencies]
futures-util.workspace = true
tokio-util = { workspace = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
nusb = { workspace = true, features = ["tokio"] }

[target.'cfg(target_os = "android")'.dependencies]
nusb-android = { workspace = true, features = ["tokio"] }

[build-dependencies]
livi-cfg.workspace = true

[lints]
workspace = true
