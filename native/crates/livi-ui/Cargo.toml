[package]
name = "livi-ui"
version.workspace = true
edition.workspace = true
description.workspace = true
homepage.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "LIVI"
path = "src/main.rs"

[dependencies]
base64.workspace = true
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
libc.workspace = true
livi-core-client.workspace = true
livi-core-proto.workspace = true
livi-ui-model.workspace = true
raw-window-handle = "0.6.2"
serde_json.workspace = true
slint = { workspace = true, features = [
  "std",
  "compat-1-2",
  "renderer-software",
  "raw-window-handle-06",
  "unstable-fontique-011",
] }

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { workspace = true, features = [
  "backend-winit",
  "backend-winit-wayland",
  "renderer-femtovg",
  "unstable-winit-030",
] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { workspace = true, features = ["backend-android-activity-06"] }
i-slint-backend-android-activity = { version = "=1.18.1", default-features = false, features = ["aa-06"] }

[target.'cfg(target_os = "macos")'.dependencies]
livi-video-view.workspace = true
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSCursor",
  "NSResponder",
  "NSScreen",
  "NSView",
  "NSWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSAppleEventManager",
  "NSGeometry",
] }

[build-dependencies]
slint-build.workspace = true

[lints]
workspace = true
