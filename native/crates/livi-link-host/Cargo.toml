[package]
name = "livi-link-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libc.workspace = true
livi-net.workspace = true
livi-wifi.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time", "sync", "io-util", "net"] }

[target.'cfg(not(target_os = "ios"))'.dependencies]
livi-base.workspace = true
livi-session-io.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
nusb = { workspace = true, features = ["tokio"] }

[target.'cfg(target_os = "android")'.dependencies]
iap2-usbmux.workspace = true
nusb-android = { workspace = true, features = ["tokio"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net", "test-util"] }

[build-dependencies]
livi-cfg.workspace = true

[lints]
workspace = true
