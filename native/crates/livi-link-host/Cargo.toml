[package]
name = "livi-link-host"
version = "0.1.0"
edition.workspace = true

[dependencies]
futures-util.workspace = true
libc.workspace = true
livi-net.workspace = true
livi-wifi.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time", "sync", "io-util", "net"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
nusb = { workspace = true, features = ["tokio"] }

[target.'cfg(target_os = "android")'.dependencies]
nusb-android = { workspace = true, features = ["tokio"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net", "test-util"] }
