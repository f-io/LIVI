[package]
name = "livid"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "livid"
path = "src/main.rs"

[features]
screen = ["dep:drm", "dep:png"]
imx6ul = ["dep:imx6ul-uboot"]

[dependencies]
livi-base.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
livi-mdns.workspace = true
livi-link-ap.workspace = true
livi-web.workspace = true
livi-link-hci.workspace = true
livi-net.workspace = true
iap2-mfi.workspace = true
libc.workspace = true
drm = { version = "0.14.1", optional = true }
png = { version = "0.18.1", optional = true }
imx6ul-uboot = { workspace = true, optional = true }

[lints]
workspace = true
