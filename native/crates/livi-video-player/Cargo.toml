[package]
name = "livi-video-player"
version.workspace = true
edition.workspace = true
license.workspace = true

# v1_24 matches the oldest build host, the CI runner.
[dependencies]
livi-video.workspace = true
gstreamer = { workspace = true, features = ["v1_24"] }
gstreamer-app = { workspace = true, features = ["v1_24"] }
gstreamer-base = { workspace = true, features = ["v1_24"] }
livi-output-proto.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
gstreamer-video = { workspace = true, features = ["v1_24"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
gstreamer-video = { workspace = true, features = ["v1_24"] }

[features]
window-view = ["dep:gstreamer-video"]

[lints]
workspace = true
