[package]
name = "livi-aa"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
livi-aa-proto.workspace = true
livi-output-proto.workspace = true
livi-session-io.workspace = true
livi-wifi.workspace = true
prost.workspace = true
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pemfile = "2"
serde_json.workspace = true
socket2 = { workspace = true, features = ["all"] }
tokio = { workspace = true, features = ["rt", "macros", "time", "sync", "io-util", "net"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
nusb = { workspace = true, features = ["tokio"] }

[target.'cfg(target_os = "android")'.dependencies]
nusb-android = { workspace = true, features = ["tokio"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net"] }

[lints]
workspace = true
