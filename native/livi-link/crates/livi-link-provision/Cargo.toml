[package]
name = "livi-link-provision"
version = "0.1.0"
edition.workspace = true

[dependencies]
backhand = { version = "0.25", default-features = false, features = ["xz", "xz-static", "gzip", "error-strings"] }
imx6ul-uboot.workspace = true
md-5 = "0.11"
sha2.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
ureq = { version = "3", features = ["json"] }
