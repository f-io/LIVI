[package]
edition = "2021"
rust-version = "1.88"
name = "femtovg"
version = "0.27.0"
authors = [
    "Peter Todorov <ptodorov@cytec.bg>",
    "Adam Nemecek <adamnemecek@gmail.com>",
]
build = false
exclude = [
    "assets",
    "examples",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Antialiased 2D vector drawing library"
readme = "README.md"
keywords = [
    "graphics",
    "canvas",
    "vector",
    "drawing",
    "gpu",
]
categories = ["graphics"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/femtovg/femtovg"

[package.metadata.docs.rs]
