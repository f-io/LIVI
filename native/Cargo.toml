[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
exclude = ["vendor"]

[patch.crates-io]
femtovg = { path = "vendor/femtovg" }
i-slint-backend-android-activity = { path = "vendor/i-slint-backend-android-activity" }

[workspace.package]
version = "10.5.0"
edition = "2024"
description = "LIVI - Linux In-Vehicle Infotainment"
homepage = "https://f-io.dev"
authors = ["Lasse Heitgres"]
license = "GPL-3.0-or-later"

[workspace.lints.clippy]
dbg_macro = "warn"
undocumented_unsafe_blocks = "warn"

[workspace.dependencies]
# Every crate takes libc from here, so all of them follow the 1.0 API.
libc = "1.0.0-alpha.5"
aes = "0.9.4"
base64 = "0.23.1"
flate2 = "1.1.11"
futures-util = "0.3.34"
glib = "0.22.10"
glib-unix = "0.22.8"
gstreamer = "0.25.4"
gstreamer-app = "0.25.2"
gstreamer-audio = "0.25"
gstreamer-base = "0.25"
gstreamer-controller = "0.25"
gstreamer-video = "0.25"
lzokay-native = "0.2.1"
nusb = "0.2.9"
nusb-android = { package = "nusb", git = "https://github.com/f-io/nusb", rev = "10895e1a7c762498324cb1c36a4b67cf60083235" }
prost = "0.14.5"
serde = "1.0.229"
serde_json = "1.0.154"
slint = { version = "1.18.1", default-features = false }
slint-build = "1.18.1"
socket2 = "0.6.5"
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-util = "0.7.20"
uuid = "1.29.2"
zbus = { version = "6.2.1", default-features = false }

iap2-csm = { path = "crates/iap2-csm" }
iap2-link = { path = "crates/iap2-link" }
iap2-mfi = { path = "crates/iap2-mfi" }
iap2-usbmux = { path = "crates/iap2-usbmux" }
iap2-wired = { path = "crates/iap2-wired" }
imx6ul-uboot = { path = "crates/imx6ul-uboot" }
livi-base = { path = "crates/livi-base" }
livi-aa = { path = "crates/livi-aa" }
livi-aa-proto = { path = "crates/livi-aa-proto" }
livi-aa-stack = { path = "crates/livi-aa-stack" }
livi-aaudio = { path = "crates/livi-aaudio" }
livi-audio = { path = "crates/livi-audio" }
livi-bt-host = { path = "crates/livi-bt-host" }
livi-core = { path = "crates/livi-core" }
livi-core-client = { path = "crates/livi-core-client" }
livi-core-proto = { path = "crates/livi-core-proto" }
livi-cp = { path = "crates/livi-cp" }
livi-crypto = { path = "crates/livi-crypto" }
livi-dab = { path = "crates/livi-dab" }
livi-fm = { path = "crates/livi-fm" }
livi-helper = { path = "crates/livi-helper" }
livi-helper-stack = { path = "crates/livi-helper-stack" }
livi-hfp = { path = "crates/livi-hfp" }
livi-link-ap = { path = "crates/livi-link-ap" }
livi-link-hci = { path = "crates/livi-link-hci" }
livi-link-host = { path = "crates/livi-link-host" }
livi-link-provision = { path = "crates/livi-link-provision" }
livi-mdns = { path = "crates/livi-mdns" }
livi-media = { path = "crates/livi-media" }
livi-net = { path = "crates/livi-net" }
livi-output = { path = "crates/livi-output" }
livi-output-proto = { path = "crates/livi-output-proto" }
livi-rtlsdr = { path = "crates/livi-rtlsdr" }
livi-screen-stream = { path = "crates/livi-screen-stream" }
livi-session-io = { path = "crates/livi-session-io" }
livi-i18n = { path = "crates/livi-i18n" }
livi-ui = { path = "crates/livi-ui" }
livi-ui-model = { path = "crates/livi-ui-model" }
livi-video = { path = "crates/livi-video" }
livi-video-player = { path = "crates/livi-video-player" }
livi-video-view = { path = "crates/livi-video-view" }
livi-web = { path = "crates/livi-web" }
livi-wifi = { path = "crates/livi-wifi" }

# The DAB+ and FM receivers demodulate in real time, also in debug builds.
[profile.dev.package.livi-dab]
opt-level = 3

[profile.dev.package.livi-fm]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3

[profile.embedded]
inherits = "release"
opt-level = "z"
codegen-units = 1
strip = true
panic = "abort"
lto = true
