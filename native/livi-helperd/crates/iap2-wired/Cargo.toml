[package]
name = "iap2-wired"
version = "0.1.0"
edition.workspace = true

[dependencies]
iap2-usbmux.workspace = true
idevice = { version = "0.1", features = ["pair", "usbmuxd"] }
plist = "1"
uuid = { workspace = true, features = ["v4"] }
tokio = { workspace = true, features = ["rt", "sync", "io-util", "time", "process"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "test-util"] }
