[package]
name = "livi-runtime"
version = "0.1.0"
edition.workspace = true

[dependencies]
livi-host-proto = { path = "../../../livi-gst-video/rust/hostproto" }
iap2-csm = { path = "../iap2-csm" }
iap2-link = { path = "../iap2-link" }
iap2-mfi = { path = "../iap2-mfi" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "io-util", "net", "process"] }
futures-util = "0.3"
libc = "0.2"
base64 = "0.22"
serde_json = "1"
socket2 = { version = "0.5", features = ["all"] }
zbus = { version = "4", default-features = false, features = ["tokio"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "test-util"] }
