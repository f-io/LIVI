[package]
name = "livi-link-provision"
version = "0.1.0"
edition.workspace = true

[dependencies]
backhand = { version = "0.25", default-features = false, features = ["xz", "xz-static", "gzip", "error-strings"] }
md-5 = "0.11"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
