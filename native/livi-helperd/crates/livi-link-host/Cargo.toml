[package]
name = "livi-link-host"
version = "0.1.0"
edition.workspace = true

[dependencies]
futures-util = "0.3"
libc.workspace = true
livi-net = { path = "../livi-net" }
livi-wifi = { path = "../livi-wifi" }
nusb = { version = "0.2", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "io-util", "net"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net", "test-util"] }
