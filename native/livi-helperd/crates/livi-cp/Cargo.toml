[package]
name = "livi-cp"
version = "0.1.0"
edition.workspace = true

[dependencies]
aes = "0.9.3"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
ctr = "0.10.1"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
num-bigint = "0.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.53.2", features = ["rt", "macros", "net", "io-util", "sync", "time"] }
uuid = { version = "1.27.0", features = ["v4"] }
x25519-dalek = { version = "3.0.0", features = ["getrandom"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "test-util"] }
