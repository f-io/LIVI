[package]
name = "livi-cp"
version = "0.1.0"
edition.workspace = true

[dependencies]
aes.workspace = true
base64.workspace = true
chacha20poly1305 = "0.11.0"
ctr = "0.10.1"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
num-bigint = "0.5.1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha1 = "0.11.0"
sha2.workspace = true
socket2 = { workspace = true, features = ["all"] }
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util", "sync", "time"] }
uuid = { workspace = true, features = ["v4"] }
x25519-dalek = { version = "3.0.0", features = ["getrandom"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "test-util"] }
