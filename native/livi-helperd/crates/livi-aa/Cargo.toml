[package]
name = "livi-aa"
version = "0.1.0"
edition.workspace = true

[dependencies]
livi-host-proto = { path = "../../../livi-host-proto/rust" }
livi-session-io = { path = "../livi-session-io" }
futures-util = "0.3"
nusb = { version = "0.2", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
serde_json = "1"
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "io-util", "net"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net"] }
