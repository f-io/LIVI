[workspace]
resolver = "2"
members = [
    "crates/iap2-csm",
    "crates/iap2-link",
    "crates/iap2-mfi",
    "crates/livi-runtime",
    "crates/iap2-usbmux",
    "crates/iap2-wired",
    "crates/livi-aa",
    "crates/livi-aa-proto",
    "crates/livi-aa-stack",
    "crates/livi-session-io",
    "crates/livi-link-host",
    "crates/livi-wifi",
    "crates/livi-core-proto",
    "crates/livi-cp",
    "crates/livi-media",
    "crates/livi-net",
    "bin/livi-helperd",
    "bin/usb-probe",
    "bin/livi-core",
]

[workspace.package]
edition = "2024"

# Every crate takes libc from here, so all of them follow the 1.0 API.
[workspace.dependencies]
libc = "1.0.0-alpha.5"
