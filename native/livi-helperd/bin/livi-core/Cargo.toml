[package]
name = "livi-core"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "livi-core"
path = "src/main.rs"

[dependencies]
livi-core-proto.workspace = true
livi-aa-stack.workspace = true
livi-cp.workspace = true
livi-link-host.workspace = true
livi-host-proto.workspace = true
livi-media.workspace = true
livi-wifi.workspace = true
axum = "0.8.9"
base64.workspace = true
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
libc.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
sha2.workspace = true
socketioxide = "0.18.7"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time", "process"] }
tower-http = { version = "0.7.1", features = ["cors"] }
zbus = { workspace = true, features = ["tokio"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
