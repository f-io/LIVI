# Cross target for the V821B (Andes C907), static-linked against the Andes glibc.
# rv32gc covers what the Rust stdlib emits.
[target.riscv32gc-unknown-linux-gnu]
linker = "riscv32-linux-gcc"
rustflags = [
  "-C", "target-feature=+crt-static",
  "-C", "relocation-model=static",
  "-C", "link-arg=-static",
  "-C", "link-arg=-no-pie",
]

# Cross target for the X1600, static-linked against Bootlin's musl toolchain (Tier 3, no prebuilt
# std, same as riscv32gc-unknown-linux-gnu above: +nightly -Z build-std).
[target.mipsel-unknown-linux-musl]
linker = "mipsel-buildroot-linux-musl-gcc"
rustflags = [
  "-C", "target-feature=+crt-static,-soft-float",
  "-C", "link-arg=-static",
  "-C", "link-self-contained=no",
]
