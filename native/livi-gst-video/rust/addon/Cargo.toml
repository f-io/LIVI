[package]
name = "gst-video-addon"
version = "0.1.0"
edition.workspace = true

# scripts/build-native.mjs copies the cdylib to native/livi-gst-video/build/Release/gst_video.node.
[lib]
crate-type = ["cdylib"]

[target.'cfg(target_os = "macos")'.dependencies]
livi-host-proto.workspace = true
livi-video-player = { workspace = true, features = ["window-view"] }
napi = { version = "3.14", default-features = false, features = ["napi8"] }
napi-derive = "3.6"

[build-dependencies]
cc = "1.6"
pkg-config = "0.3"
napi-build = "2.6"
