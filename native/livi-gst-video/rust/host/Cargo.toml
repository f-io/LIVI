[package]
name = "gst-video-host"
version = "0.1.0"
edition.workspace = true

# The standalone livi-gst-host binary (Linux): the same C++ sources with
# LIVI_GST_HOST_STANDALONE, whose main() is the process entry point.
[[bin]]
name = "livi-gst-host"
path = "src/main.rs"

[dependencies]
livi-video-codec = { path = "../codec" }
livi-video-player = { path = "../player" }

[target.'cfg(target_os = "linux")'.dependencies]
livi-crypto-node = { path = "../../../livi-crypto/rust", default-features = false }
livi-video-nal = { path = "../nal" }
livi-screen-stream = { path = "../screen" }
livi-video-fanout = { path = "../fanout" }
livi-host-proto = { path = "../hostproto" }

[build-dependencies]
cc = "1"
pkg-config = "0.3"
