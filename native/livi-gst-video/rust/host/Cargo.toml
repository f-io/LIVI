[package]
name = "gst-video-host"
version = "0.1.0"
edition.workspace = true

# The standalone livi-gst-host binary the main process spawns on Linux.
[[bin]]
name = "livi-gst-host"
path = "src/main.rs"

[dependencies]
livi-audio-player = { path = "../audioplayer" }
livi-audio-stream = { path = "../audio" }
livi-audio-uplink = { path = "../mic" }
livi-host-proto = { path = "../../../livi-host-proto/rust" }
livi-screen-stream = { path = "../screen" }
livi-video-fanout = { path = "../fanout" }
livi-video-nal = { path = "../nal" }
livi-video-player = { path = "../player" }

[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.21"
libc = "0.2"
